name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Given to you. Do not delete this job.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  # ---------------------------------------------------------------------------
  # M3 — Build and test job
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: make install
      - name: Run tests
        run: make test
      - name: Build
        run: make build

      # -----------------------------------------------------------------------
      # M5 — Containerization: Build Docker Image
      # -----------------------------------------------------------------------
      - name: Build Docker image
        run: docker build -t devops-24eskcs013 .

      # -----------------------------------------------------------------------
      # M5 — Containerization: Push Docker image to container registry
      # -----------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Docker image to container registry
        if: github.ref == 'refs/heads/main'
        run: |
          ACTOR=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          docker tag devops-24eskcs013 ghcr.io/${ACTOR}/devops-24eskcs013:latest
          docker tag devops-24eskcs013 ghcr.io/${ACTOR}/devops-24eskcs013:${{ github.sha }}
          docker tag devops-24eskcs013 ghcr.io/skit-devops-2026/devops-24eskcs013:latest
          docker tag devops-24eskcs013 ghcr.io/skit-devops-2026/devops-24eskcs013:${{ github.sha }}
          docker tag devops-24eskcs013 ghcr.io/${ACTOR}/todo-practice:latest
          docker tag devops-24eskcs013 ghcr.io/${ACTOR}/todo-practice:${{ github.sha }}
          docker push ghcr.io/${ACTOR}/devops-24eskcs013:latest
          docker push ghcr.io/${ACTOR}/devops-24eskcs013:${{ github.sha }}
          docker push ghcr.io/skit-devops-2026/devops-24eskcs013:latest
          docker push ghcr.io/skit-devops-2026/devops-24eskcs013:${{ github.sha }}
          docker push ghcr.io/${ACTOR}/todo-practice:latest
          docker push ghcr.io/${ACTOR}/todo-practice:${{ github.sha }}
